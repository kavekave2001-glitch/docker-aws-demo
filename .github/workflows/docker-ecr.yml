name: Build and Push Docker Images to AWS ECR

on:
  push:
    branches:
      - main
    paths:
      - 'app1/**'
      - 'app2/**'
      - '.github/workflows/docker-ecr.yml'

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecr-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsECRPush

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push App1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-docker-app/app1:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/my-docker-app/app1:latest" \
            ./app1

          docker push "$ECR_REGISTRY/my-docker-app/app1:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/my-docker-app/app1:latest"

      - name: Build and push App2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/my-docker-app/app2:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/my-docker-app/app2:latest" \
            ./app2

          docker push "$ECR_REGISTRY/my-docker-app/app2:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/my-docker-app/app2:latest"

      - name: Deployment summary
        run: |
          echo "### Successfully published Docker images" >> "$GITHUB_STEP_SUMMARY"
          echo "App1: my-docker-app/app1" >> "$GITHUB_STEP_SUMMARY"
          echo "App2: my-docker-app/app2" >> "$GITHUB_STEP_SUMMARY"
          echo "Image tag: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"